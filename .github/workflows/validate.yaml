name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  session-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x'}
      - run: go test ./...
      - run: docker build --file Dockerfile.session-router .
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint charts/connectool --values charts/connectool/examples/example-values.yaml
      - name: Render
        run: helm template connectool charts/connectool --values charts/connectool/examples/example-values.yaml > /tmp/connectool.yaml
      - name: Verify vMCP runtime policy
        run: |
          grep -q 'source: inline' /tmp/connectool.yaml
          grep -q 'name: internal-backend' /tmp/connectool.yaml
          grep -q 'partialFailureMode: best_effort' /tmp/connectool.yaml
          grep -q 'healthCheckInterval: 30s' /tmp/connectool.yaml
          grep -q 'backendInit: 5s' /tmp/connectool.yaml
          grep -q 'disabledWorkloads:' /tmp/connectool.yaml
          grep -q -- '- observe' /tmp/connectool.yaml
          grep -q 'example.com/worker-pool' /tmp/connectool.yaml
          grep -q 'topologySpreadConstraints:' /tmp/connectool.yaml
          grep -q 'name: vmcp' /tmp/connectool.yaml
          grep -q 'memory: 512Mi' /tmp/connectool.yaml
          grep -q 'provider: memory' /tmp/connectool.yaml
          grep -q 'sessionAffinity: ClientIP' /tmp/connectool.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/connectool.yaml
          grep -q 'kind: MutatingAdmissionPolicy' /tmp/connectool.yaml
          grep -q "/spec/template/spec/nodeSelector/kubernetes.io~1hostname" /tmp/connectool.yaml
          grep -q 'Object.spec.template.spec.affinity.nodeAffinity{' /tmp/connectool.yaml
          grep -q 'Object.spec.template.spec.affinity.podAntiAffinity{' /tmp/connectool.yaml
          grep -Fq "'app': object.metadata.labels['app']" /tmp/connectool.yaml
          grep -q 'Object.spec.strategy.rollingUpdate{' /tmp/connectool.yaml
          grep -q 'PreferSameNode' /tmp/connectool.yaml
          grep -q "path: '/spec/sessionAffinity'" /tmp/connectool.yaml
          grep -q 'backendSessionAffinity' charts/connectool/values.schema.json
          grep -q 'progressDeadlineSeconds' /tmp/connectool.yaml
          grep -q 'name: platform-tools-session-router' /tmp/connectool.yaml
          grep -q 'BACKEND_SERVICE' /tmp/connectool.yaml
          grep -q 'vmcp-platform-tools' /tmp/connectool.yaml
          grep -q 'Mcp-Session-Id' /tmp/connectool.yaml
          grep -q 'resources: \["endpointslices"\]' /tmp/connectool.yaml
          grep -q 'app.kubernetes.io/name: connectool-session-router' /tmp/connectool.yaml
          grep -q 'trafficDistribution: PreferSameNode' /tmp/connectool.yaml
      - name: Verify Redis compatibility and schema rejection
        run: |
          helm template connectool charts/connectool \
            --values charts/connectool/examples/example-values.yaml \
            --set toolhive.sessionRouting.enabled=false \
            --set toolhive.sessionStorage.provider=redis \
            --set toolhive.sessionStorage.sessionAffinity=None \
            --set toolhive.sessionStorage.address=redis.example.svc:6379 \
            --set toolhive.sessionStorage.passwordSecretRef.name=redis-auth \
            --set toolhive.sessionStorage.passwordSecretRef.key=password \
            | grep -q 'address: "redis.example.svc:6379"'
          if helm template connectool charts/connectool \
            --values charts/connectool/examples/example-values.yaml \
            --set toolhive.sessionStorage.address=redis.example.svc:6379 >/dev/null 2>&1; then
            echo 'memory session storage accepted a Redis address' >&2
            exit 1
          fi
      - name: Create admission-policy test cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: connectool-policy
          version: v0.32.0
          node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
      - name: Verify typed mutation on an existing affinity
        run: |
          kubectl create namespace toolhive-system
          helm template connectool charts/connectool \
            --values charts/connectool/examples/example-values.yaml \
            --show-only templates/runtime-policy.yaml \
            | kubectl apply -f -
          # Admission policy and binding caches converge asynchronously.
          sleep 5
          cat <<'EOF' | kubectl apply --server-side --dry-run=server -f - -o yaml > /tmp/mutated-workload.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: typed-affinity-upgrade
            namespace: toolhive-system
            labels:
              app: mcpserver
              toolhive: "true"
              toolhive-name: typed-affinity-upgrade
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: typed-affinity-upgrade
            template:
              metadata:
                labels:
                  app: typed-affinity-upgrade
                  toolhive: "true"
                  toolhive-name: typed-affinity-upgrade
              spec:
                nodeSelector:
                  kubernetes.io/hostname: legacy-worker
                affinity:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 1
                        preference:
                          matchExpressions:
                            - key: old.example/placement
                              operator: Exists
                containers:
                  - name: toolhive
                    image: registry.k8s.io/pause:3.10
          EOF
          cat /tmp/mutated-workload.yaml
          grep -q 'key: kubernetes.io/hostname' /tmp/mutated-workload.yaml
          grep -q 'maxUnavailable: 1' /tmp/mutated-workload.yaml
          grep -q 'memory: 64Mi' /tmp/mutated-workload.yaml
          grep -q 'app: mcpserver' /tmp/mutated-workload.yaml
          if grep -q 'legacy-worker' /tmp/mutated-workload.yaml; then
            echo 'legacy hostname selector survived the mutation' >&2
            exit 1
          fi
          cat <<'EOF' | kubectl apply --server-side --dry-run=server -f - -o yaml > /tmp/mutated-backend-service.yaml
          apiVersion: v1
          kind: Service
          metadata:
            name: typed-backend
            namespace: toolhive-system
            labels:
              app: typed-backend
              toolhive: "true"
              toolhive-name: shared-instance
          spec:
            sessionAffinity: ClientIP
            selector:
              app: typed-backend
            ports:
              - port: 8088
          EOF
          grep -q 'sessionAffinity: None' /tmp/mutated-backend-service.yaml
          grep -q 'trafficDistribution: PreferSameNode' /tmp/mutated-backend-service.yaml
      - name: Enforce provider-neutral chart
        run: |
          if grep -RniE 'registry\.re8ch\.com|dex\.re8ch\.com|re8ch-headlamp' charts/connectool; then
            echo 'private deployment settings must not enter the upstream chart' >&2
            exit 1
          fi

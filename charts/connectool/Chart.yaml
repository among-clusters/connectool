apiVersion: v2
name: connectool
description: ConnecTool packages identity, ToolHive MCP/Skill publication, and cross-platform AI plugin distribution contracts.
type: application
version: 0.6.0
appVersion: "0.6.0"
kubeVersion: ">=1.30.0-0"
home: https://github.com/re8ch/connectool
sources: [https://github.com/re8ch/connectool]
keywords: [connectool, dex, toolhive, mcp, plugins, skills, registry]
maintainers:
  - name: ConnecTool maintainers
    url: https://github.com/re8ch/connectool
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: Publish a provider-neutral platform distribution matrix for self-service, vendor-review, OAuth-gated, and unavailable channels.
    - kind: fixed
      description: Allow an explicit capacity-limited singleton vMCP while retaining session routing.
    - kind: added
      description: Support ToolHive backend initialization timeouts and per-workload list_changed subscription policy.
    - kind: added
      description: Route memory-backed MCP sessions by Mcp-Session-Id to the vMCP pod that initialized them, with same-node preference and stateless router failover.
    - kind: fixed
      description: Disable backend Service session affinity so same-node routing is not overridden by a stale remote endpoint pin.
    - kind: fixed
      description: Remove legacy hostname node selectors from ToolHive child workloads before applying the shared placement contract.
    - kind: added
      description: Support node-local memory sessions, disruption budgets, same-node service routing, and bounded ToolHive child rollouts.
    - kind: added
      description: Enforce shared affinity, tolerations, topology spread, and vMCP resource budgets through the placement contract.
    - kind: changed
      description: Default publications to one replica and inherit one global placement contract.
    - kind: added
      description: Render global node selection into every VirtualMCPServer pod template.
    - kind: changed
      description: Sign the public GHCR artifact with GitHub OIDC for Flux verification.
    - kind: added
      description: Dex public PKCE client registration contracts.
    - kind: added
      description: ToolHive OIDC, virtual MCP aggregation, and Registry source contracts.
    - kind: added
      description: Codex marketplace metadata with a single MCP owner and reusable Skill-only plugins.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/re8ch/connectool
    - name: support
      url: https://github.com/re8ch/connectool/issues

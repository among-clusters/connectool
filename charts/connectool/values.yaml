global:
  issuer: https://dex.example.com
  scopes: [openid, profile, email, groups, offline_access]

dex:
  # This chart deliberately publishes a non-secret desired-client contract.
  # Reconcile it into Dex with the platform's secret-aware controller/process.
  contract:
    enabled: true
    namespace: dex
    configMapName: ""

toolhive:
  namespace: toolhive-system
  # One placement contract applies to every publication. A publication cannot
  # silently escape the application's scheduling boundary.
  placement:
    nodeSelector: {}
    affinity: {}
    tolerations: []
    topologySpreadConstraints: []
    resources: {}
  # Optional policy for resources generated by the ToolHive operator. It is
  # disabled by default because it creates cluster-scoped admission objects.
  runtimePolicy:
    enabled: false
    nodeNames: []
    trafficDistribution: PreferSameNode
    # Backend Services must not pin a proxy to a remote backend; proxy/vMCP
    # Services retain the session affinity declared by their ToolHive CRs.
    backendSessionAffinity: None
    proxyResources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
    rollout:
      maxUnavailable: 1
      maxSurge: 0
      progressDeadlineSeconds: 180
  registry:
    enabled: true
    name: approved
    sources: []
    release:
      enabled: false
      version: 1.5.0
      sourceNamespace: flux-system
      values: {}
  sessionStorage:
    provider: memory
    sessionAffinity: ClientIP
  # Optional L7 router for memory-backed, multi-replica vMCP publications. It
  # wraps the opaque Mcp-Session-Id with the ready endpoint that created it,
  # so any router replica can return later requests to that same vMCP pod.
  sessionRouting:
    enabled: false
    replicas: 2
    image:
      repository: ghcr.io/among-clusters/connectool-session-router
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    listenPort: 8080
    servicePort: 4483
    backendPort: 4483
    sessionHeader: Mcp-Session-Id
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
  publications: []
  # - name: platform-tools
  #   clientId: platform-tools
  #   resourceUrl: https://tools.example.com/mcp
  #   group: platform-tools
  #   createGroup: true
  #   replicas: 1
  #   sessionAffinity: ClientIP
  #   workloads:
  #     - {name: observe, toolConfigRef: observe-tools}
  #   authorization:
  #     groupClaim: groups
  #     policies: ['permit(principal, action, resource);']
  #   session: {database: 1, keyPrefix: "thv:tools:"}
  #   outgoingAuth:
  #     source: inline
  #     default: {type: discovered}
  #     backends:
  #       observe: {type: externalAuthConfigRef, externalAuthConfigRef: {name: internal-backend}}
  #   operational:
  #     failureHandling: {partialFailureMode: best_effort, healthCheckInterval: 30s}
  #     timeouts: {backendInit: 5s}
  #     listChanged: {disabledWorkloads: [backend-that-does-not-stream-notifications]}

codex:
  marketplace:
    name: connectool
    displayName: ConnecTool
    source: https://github.com/example/codex-plugins.git
  plugins: []
  # Exactly one plugin may own each publication's MCP registration. Skill-only
  # plugins reference the owner and therefore do not render duplicate servers.
  # - name: platform-tool
  #   publication: platform-tools
  #   category: Productivity
  #   mcpOwner: true
  #   skills: [skills/platform/SKILL.md]
  # - name: cluster-operations
  #   publication: platform-tools
  #   category: Developer Tools
  #   mcpOwner: false
  #   skills: [skills/cluster/SKILL.md]

# Cross-platform release state is a non-secret contract. It records which
# packages are ready, which channels require vendor review, and which external
# OAuth registrations still gate activation. It never claims that a vendor has
# approved or published an integration.
distribution:
  updated: ""

global:
  issuer: https://identity.example.com
  scopes: [openid, profile, email, groups, offline_access]
dex:
  contract: {enabled: true, namespace: identity-system, configMapName: connectool-oidc-clients}
toolhive:
  namespace: toolhive-system
  placement:
    nodeSelector: {kubernetes.io/os: linux}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions: [{key: example.com/worker-pool, operator: In, values: [ai]}]
    tolerations: [{key: example.com/dedicated, operator: Equal, value: ai, effect: NoSchedule}]
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector: {matchLabels: {app.kubernetes.io/name: connectool}}
    hostAliases:
      - {ip: 192.0.2.10, hostnames: [issuer.example.com]}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  runtimePolicy:
    enabled: true
    nodeNames: [worker-a, worker-b]
    trafficDistribution: PreferSameNode
    backendSessionAffinity: None
    proxyResources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
    rollout: {maxUnavailable: 1, maxSurge: 0, progressDeadlineSeconds: 180}
  registry:
    enabled: true
    name: approved
    sources:
      - {name: managed-workloads, kubernetes: {namespaces: [toolhive-system]}}
    release: {enabled: false, version: 1.5.0, sourceNamespace: flux-system, values: {}}
  sessionStorage:
    provider: memory
    sessionAffinity: ClientIP
  sessionRouting:
    enabled: true
    replicas: 2
    image: {repository: ghcr.io/among-clusters/connectool-session-router, tag: "", digest: "", pullPolicy: IfNotPresent}
    listenPort: 8080
    servicePort: 4483
    backendPort: 4483
    sessionHeader: Mcp-Session-Id
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
  publications:
    - name: platform-tools
      clientId: platform-tools
      resourceUrl: https://tools.example.com/mcp
      group: platform-tools
      createGroup: true
      replicas: 2
      workloads:
        - {name: observe, toolConfigRef: observe-tools}
      outgoingAuth:
        source: inline
        default: {type: discovered}
        backends:
          observe: {type: externalAuthConfigRef, externalAuthConfigRef: {name: internal-backend}}
      operational:
        timeouts:
          backendInit: 5s
        listChanged:
          disabledWorkloads: [observe]
        failureHandling:
          partialFailureMode: best_effort
          healthCheckInterval: 30s
          healthCheckTimeout: 10s
          unhealthyThreshold: 3
          circuitBreaker: {enabled: true, failureThreshold: 5, timeout: 1m}
      authorization:
        groupClaim: groups
        policies: ['permit(principal, action, resource);']
codex:
  marketplace:
    name: example-tools
    displayName: Example Tools
    source: https://github.com/example/codex-plugins.git
  plugins:
    - name: platform-tool
      publication: platform-tools
      category: Productivity
      mcpOwner: true
      skills: [skills/platform/SKILL.md]
distribution:
  updated: "2026-09-23"
  channels:
    - id: openai-private
      surfaces: [ChatGPT, ChatGPT Work, Codex]
      entryClass: self-service
      status: package-ready
      integration: agent-plugin
      publication: platform-tools
      artifact: .agents/plugins/marketplace.json
      detail: Portable package is ready; account-local MCP registration remains.
      documentation: https://developers.openai.com/plugins/build/plugins
    - id: openai-public
      surfaces: [ChatGPT, Codex]
      entryClass: official-review
      status: review-required
      integration: universal-plugin-directory
      publication: platform-tools
      detail: Verified publisher identity and OpenAI review are required.
      documentation: https://developers.openai.com/plugins/deploy/submission
    - id: doubao
      surfaces: [Doubao]
      entryClass: unavailable
      status: new-publication-unavailable
      integration: coze-publish-channel
      detail: Coze removed new Doubao publication on 2026-07-01.
      documentation: https://docs.coze.cn/recent-updates

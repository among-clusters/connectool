{{- if .Values.toolhive.runtimePolicy.enabled }}
{{- $policyName := printf "connectool-%s-toolhive-runtime" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $runtime := .Values.toolhive.runtimePolicy }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ $policyName }}
  labels:
    {{- include "connectool.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  matchConditions:
    - name: is-toolhive-child-workload
      expression: >-
        object.metadata.namespace == {{ .Values.toolhive.namespace | quote }} &&
        has(object.metadata.labels) &&
        'toolhive' in object.metadata.labels &&
        object.metadata.labels['toolhive'] == 'true' &&
        'toolhive-name' in object.metadata.labels &&
        'app' in object.metadata.labels
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.template.spec.nodeSelector) &&
          'kubernetes.io/hostname' in object.spec.template.spec.nodeSelector
          ? [JSONPatch{
              op: 'remove',
              path: '/spec/template/spec/nodeSelector/kubernetes.io~1hostname'
            }]
          : []
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{
            op: has(object.spec.template.spec.affinity) ? 'replace' : 'add',
            path: '/spec/template/spec/affinity',
            value: Object.spec.template.spec.affinity{
              nodeAffinity: Object.spec.template.spec.affinity.nodeAffinity{
                requiredDuringSchedulingIgnoredDuringExecution: Object.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution{
                  nodeSelectorTerms: [Object.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms{
                    matchExpressions: [Object.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.matchExpressions{
                      key: 'kubernetes.io/hostname',
                      operator: 'In',
                      values: {{ $runtime.nodeNames | toJson }}
                    }]
                  }]
                }
              },
              podAntiAffinity: Object.spec.template.spec.affinity.podAntiAffinity{
                requiredDuringSchedulingIgnoredDuringExecution: [Object.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution{
                  labelSelector: Object.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector{
                    matchLabels: {
                      'toolhive-name': object.metadata.labels['toolhive-name'],
                      'app': object.metadata.labels['app']
                    }
                  },
                  topologyKey: 'kubernetes.io/hostname'
                }]
              }
            }
          }]
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.kind == 'Deployment' &&
          has(object.metadata.labels) &&
          'app' in object.metadata.labels &&
          object.metadata.labels['app'] == 'mcpserver'
          ? [JSONPatch{
              op: has(object.spec.template.spec.containers[0].resources) ? 'replace' : 'add',
              path: '/spec/template/spec/containers/0/resources',
              value: {{ $runtime.proxyResources | toJson }}
            }]
          : []
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.kind == 'Deployment'
          ? [
              JSONPatch{
                op: has(object.spec.strategy) ? 'replace' : 'add',
                path: '/spec/strategy',
                value: Object.spec.strategy{
                  type: 'RollingUpdate',
                  rollingUpdate: Object.spec.strategy.rollingUpdate{
                    maxUnavailable: {{ $runtime.rollout.maxUnavailable }},
                    maxSurge: {{ $runtime.rollout.maxSurge }}
                  }
                }
              },
              JSONPatch{
                op: has(object.spec.progressDeadlineSeconds) ? 'replace' : 'add',
                path: '/spec/progressDeadlineSeconds',
                value: {{ $runtime.rollout.progressDeadlineSeconds }}
              }
            ]
          : []
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ $policyName }}
  labels:
    {{- include "connectool.labels" . | nindent 4 }}
spec:
  policyName: {{ $policyName }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.toolhive.namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ printf "%s-services" $policyName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "connectool.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: is-toolhive-child-service
      expression: >-
        object.metadata.namespace == {{ .Values.toolhive.namespace | quote }} &&
        has(object.metadata.labels) &&
        'toolhive' in object.metadata.labels &&
        object.metadata.labels['toolhive'] == 'true'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{
            op: has(object.spec.trafficDistribution) ? 'replace' : 'add',
            path: '/spec/trafficDistribution',
            value: {{ $runtime.trafficDistribution | quote }}
          }]
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.metadata.labels) &&
          'app' in object.metadata.labels &&
          object.metadata.labels['app'] != 'mcpserver' &&
          object.metadata.labels['app'] != 'virtualmcpserver'
          ? [JSONPatch{
              op: has(object.spec.sessionAffinity) ? 'replace' : 'add',
              path: '/spec/sessionAffinity',
              value: {{ $runtime.backendSessionAffinity | quote }}
            }]
          : []
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ printf "%s-services" $policyName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "connectool.labels" . | nindent 4 }}
spec:
  policyName: {{ printf "%s-services" $policyName | trunc 63 | trimSuffix "-" }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.toolhive.namespace }}
{{- end }}
